name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Godot 4.7.1 / GUT 9.7.1
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository and pinned dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Run repository checks
        run: ./tools/test.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gut-results
          path: test-results/
          if-no-files-found: ignore
